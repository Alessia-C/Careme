name: E2E
on:
  pull_request:
    # `labeled` re-runs the job when the `update-snapshots` label is added.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # With the `update-snapshots` label the visual baselines are rewritten
      # (on Linux, as CI expects) and uploaded in the artifact below.
      - run: npx playwright test ${{ contains(github.event.pull_request.labels.*.name, 'update-snapshots') && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/__screenshots__/
          retention-days: 14
